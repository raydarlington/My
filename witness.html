<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Witness — Darlington Raymond</title>
<style>
*{box-sizing:border-box}
html{background:#fff}
body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{max-width:1120px;margin:0 auto;padding:24px 26px 64px;animation:enter .62s cubic-bezier(.22,.61,.36,1) both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
header{position:relative;display:flex;align-items:center;justify-content:center;min-height:86px;border-bottom:1px solid #111}
.back{position:absolute;left:0;top:50%;transform:translateY(-50%);color:#111;text-decoration:none;font-size:30px;line-height:1}
.name{font-size:24px;font-weight:400}
.intro{padding:48px 0 34px}
h1{font-size:42px;font-weight:400;line-height:1.05;margin:0 0 10px}
.intro p{margin:0;color:#666;font-size:16px;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:52px 28px}
.work img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff}
.meta{padding-top:13px}
.meta strong{display:block;font-size:22px;font-weight:400;margin-bottom:5px}
.meta span{display:block;color:#666;font-size:16px;font-style:italic;line-height:1.4}
@media(max-width:680px){
  .page{padding:18px 18px 48px}
  header{min-height:74px}
  .name{font-size:21px}
  .back{font-size:28px}
  .intro{padding:36px 0 26px}
  h1{font-size:34px}
  .grid{grid-template-columns:1fr;gap:42px}
}
@media(prefers-reduced-motion:reduce){.page{animation:none}}
</style>
</head>
<body>
<main class="page">
<header>
<a class="back" href="index.html#works" aria-label="Back to Works">←</a>
<div class="name">Darlington Raymond</div>
</header>

<section class="intro">
<h1>Witness</h1>
<p>Series · 4 works</p>
</section>

<section class="grid">
<article class="work">
<img src="images/witness-1.webp" alt="Witness 1">
<div class="meta"><strong>Witness 1</strong><span>15.5 cm diameter · Acrylic on canvas</span></div>
</article>

<article class="work">
<img src="images/witness-2.webp" alt="Witness 2">
<div class="meta"><strong>Witness 2</strong><span>15.5 cm diameter · Acrylic on canvas</span></div>
</article>

<article class="work">
<img src="images/witness-3.webp" alt="Witness 3">
<div class="meta"><strong>Witness 3</strong><span>15.5 cm diameter · Acrylic on canvas</span></div>
</article>

<article class="work">
<img src="images/witness-4.webp" alt="Witness 4">
<div class="meta"><strong>Witness 4</strong><span>15.5 cm diameter · Acrylic on canvas</span></div>
</article>
</section>
</main>
</body>
</html>
